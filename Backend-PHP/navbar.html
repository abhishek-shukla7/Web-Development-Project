<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation Bar with Internal Links</title>

    <style>
       
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #333;
            position: fixed;
            width: 100%;
            top: 0;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            padding: 15px 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li a:hover {
            background-color: #555;
            padding: 10px;
            border-radius: 5px;
        }

       
        section {
            padding: 80px 20px;
            min-height: 100vh;
        }

        #home {
            background-color: #f2f2f2;
        }

        #about {
            background-color: #e6e6e6;
        }

        #services {
            background-color: #d9d9d9;
        }

        #contact {
            background-color: #cccccc;
        }

        h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

 
    <section id="home">
        <h2>Home</h2>
        <p>Welcome to our website.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>This section contains information about us.</p>
    </section>

    <section id="services">
        <h2>Services</h2>
        <p>We provide web development, design, and IT services.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: navbar@gmail.com</p>
        <p>Phone: +91 98***44**4</p>
    </section>

</body>
</html>
