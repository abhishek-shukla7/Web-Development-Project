<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Modules</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .container {
            display: flex;
            justify-content: space-between;
            gap: 30px;
        }

        .module {
            width: 30%;
            text-align: center;
        }

        .box {
            height: 140px;
            border: 2px solid #2c3e50;
            border-radius: 10px;
            background-color: #ffffff;
        }

        .line-text {
            margin-top: 15px;
            display: flex;
            align-items: center;
            text-align: center;
            color: #2c3e50;
            font-weight: bold;
        }

        .line-text::before,
        .line-text::after {
            content: "";
            flex: 1;
            border-bottom: 2px solid #2c3e50;
        }

        .line-text::before {
            margin-right: 10px;
        }

        .line-text::after {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<h2>Project Modules</h2>

<div class="container">

    <div class="module">
        <div class="box"></div>
        <div class="line-text">HTML Layout</div>
    </div>

    <div class="module">
        <div class="box"></div>
        <div class="line-text">PHP Backend</div>
    </div>

    <div class="module">
        <div class="box"></div>
        <div class="line-text">Future Scope</div>
    </div>

</div>

</body>
</html>
